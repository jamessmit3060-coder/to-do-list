<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>To Do List</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="main.css">
</head>

<body>

  <div class="container">

    <!-- Header -->
    <div class="header">
      <img src="a12.jpg" class="logo" alt="">
      <h1>My To Do List</h1>
    </div>

    <!-- Priority Colors -->
    <div class="legend">
      <span class="color high-color"></span>
      <span class="color medium-color"></span>
      <span class="color low-color"></span>
    </div>

    <!-- Form -->
    <div class="form">

      <input type="text" class="input" placeholder="Enter Your Task">

      <select class="priority">
  <option value="high">🔴 High</option>
<option value="medium">🟡 Medium</option>
<option value="low">🟢 Low</option>
</select>

      <input type="submit" class="add" value="Add Task">

    </div>

    <!-- Tasks -->
    <div class="tasks"></div>

  </div>

  <script src="main.js"></script>

</body>
</html>
